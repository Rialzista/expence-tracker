packages:
  - "apps/*"
  - "packages/*"
packageExtensions:
  # eslint-config-next не объявляет next зависимостью в своём package.json,
  # хотя парсер (dist/parser.js) требует next/dist/compiled/babel/eslint-parser
  # в рантайме — под npm/yarn это прощает плоский hoisting, под строгим
  # node_modules pnpm require() не может найти next и `pnpm lint` падает
  # с MODULE_NOT_FOUND. Версия совпадает с той, что в apps/web/package.json.
  eslint-config-next:
    dependencies:
      next: 16.3.3
allowBuilds:
  '@prisma/engines': true
  # Телеметрия Scarf, тянется транзитивно через swagger-ui-dist —
  # для работы Swagger не нужна, скрипт не запускаем.
  '@scarf/scarf': false
  argon2: true
  msw: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/swagger@12.0.1'
  - '@tanstack/query-core@5.102.8'
  - '@tanstack/query-devtools@5.102.8'
  - '@tanstack/react-query-devtools@5.102.8'
  - '@tanstack/react-query@5.102.8'
  - '@testing-library/react@16.3.3'
  - '@vitejs/plugin-react@6.1.1'
  - lucide-react@1.35.0
