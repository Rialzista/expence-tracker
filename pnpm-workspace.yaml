packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  # Телеметрия Scarf, тянется транзитивно через swagger-ui-dist —
  # для работы Swagger не нужна, скрипт не запускаем.
  '@scarf/scarf': false
  argon2: true
  msw: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/swagger@12.0.1'
  - '@tanstack/query-core@5.102.8'
  - '@tanstack/query-devtools@5.102.8'
  - '@tanstack/react-query-devtools@5.102.8'
  - '@tanstack/react-query@5.102.8'
  - '@testing-library/react@16.3.3'
  - '@vitejs/plugin-react@6.1.1'
  - lucide-react@1.35.0
